name: Release production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Release database, functions and web
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check release prerequisites
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -e 'any(.[]; .name == "TURNSTILE_SECRET_KEY")' >/dev/null

      - name: Preview pending migrations
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy tool submissions function
        run: |
          supabase functions deploy submit-tool --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy manifesto signatures function
        run: |
          supabase functions deploy submit-manifesto --project-ref "$SUPABASE_PROJECT_REF"

      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
