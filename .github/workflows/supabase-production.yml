name: Release production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Release database, functions and web
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Deploys run as the Vercel admin, so the commit author needs no Vercel seat.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The repository only allows GitHub-owned actions, so Bun comes from npm.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        run: npm install --global bun@1.3.10

      - name: Check release prerequisites
        run: |
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -e 'any(.[]; .name == "TURNSTILE_SECRET_KEY")' >/dev/null

      # Building before migrations keeps a broken build from leaving the
      # database ahead of the published site.
      - name: Pull Vercel production settings
        run: bunx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build web
        run: bunx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Preview pending migrations
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy tool submissions function
        run: |
          supabase functions deploy submit-tool --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy manifesto signatures function
        run: |
          supabase functions deploy submit-manifesto --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy web to production
        run: |
          url="$(bunx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")"
          echo "Produção: $url" >> "$GITHUB_STEP_SUMMARY"
