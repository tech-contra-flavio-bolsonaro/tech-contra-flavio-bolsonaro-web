name: Vercel preview

# Previews are deployed with the Vercel admin token instead of the Git
# integration, so any repository member can get a preview without a paid seat.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    # Fork pull requests never receive the admin token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Check preview prerequisites
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull Vercel preview settings
        run: bunx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build preview
        run: bunx vercel@latest build --token "$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url="$(bunx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Preview da Vercel para \`${HEAD_SHA::7}\`: $PREVIEW_URL"
